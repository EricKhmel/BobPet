# Builds and publishes a release. The companion ships inside the extension, so there is
# nothing to host and nothing for the extension to fetch at runtime.
#
# Tag a commit to release, e.g. `git tag v0.1.2 && git push origin v0.1.2`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build the companion
        run: npm run package --workspace=@bob-pet/companion

      - name: Package the extension with the companion inside it
        run: npm run package --workspace=bob-pet

      # Named from what was built, so a version bump needs no edit here.
      - name: Find the packaged extension
        shell: bash
        run: echo "VSIX=$(ls dist/bob-pet-*.vsix)" >> "$GITHUB_ENV"

      - name: Checksums
        run: npm run checksums

      # The token check is inside the step on purpose. As a step-level `if` it silently
      # skipped every time - a step's own env is not reliably available to its own
      # condition - and the run still went green, so 0.1.3 built and published nothing.
      # ovsx reads OVSX_PAT from the environment; passing it as an argument would put the
      # token on the command line, where anything on the runner could read it.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        shell: bash
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "No OPEN_VSX_TOKEN secret is set, so nothing was published."
            exit 0
          fi
          echo "Publishing $VSIX to Open VSX"
          npx --yes ovsx publish "$VSIX"

      - name: Keep the build with the tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.VSIX }}
            dist/SHA256SUMS.txt
