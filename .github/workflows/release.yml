# Builds and publishes a release. The companion ships inside the extension, so there is
# nothing to host and nothing for the extension to fetch at runtime.
#
# One build job per platform: each VSIX carries the pet built for that platform, and a
# macOS .app can only be produced on Apple hardware. Open VSX takes one upload per target,
# so a host installing the extension gets the build for the machine it is running on.
#
# Nothing is published until every build has passed. Publishing per job would mean a
# failure on one platform leaving the version live on the others, and a version that is
# already on Open VSX cannot be replaced - the only way out is to abandon the number and
# release the next one.
#
# Tag a commit to release, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build the companion
        run: npm run package --workspace=@bob-pet/companion

      - name: Package the extension with the companion inside it
        run: npm run package --workspace=bob-pet

      - uses: actions/upload-artifact@v4
        with:
          name: bob-pet-win32-x64
          path: dist/bob-pet-*.vsix

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Build the pet for macOS
        run: |
          npm run build --workspace=@bob-pet/companion
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never --project apps/companion

      # electron-builder rewrites the binary, which invalidates the signature Electron
      # ships with. Apple Silicon kills an unsigned Mach-O outright, so it is re-signed
      # ad-hoc here; that is enough to run, and needs no Apple account.
      - name: Sign the bundle
        run: |
          app=$(ls -d dist/mac*/Bob\ Pet.app | head -1)
          codesign --force --deep --sign - "$app"
          codesign -dv "$app" 2>&1 | head -3

      - name: Put the pet inside the extension
        run: node scripts/bundle-companion.mjs darwin-${{ matrix.arch }}

      - name: Package the extension for darwin-${{ matrix.arch }}
        working-directory: packages/extension
        run: npx vsce package --target darwin-${{ matrix.arch }} --out ../../dist/bob-pet-darwin-${{ matrix.arch }}.vsix

      # Unpacks the VSIX, starts the pet it carries and delivers a hook event to it the
      # way Bob would, so a package that cannot run is never published.
      - name: Smoke test the packaged extension
        run: node scripts/smoke-mac.mjs dist/bob-pet-darwin-${{ matrix.arch }}.vsix ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: bob-pet-darwin-${{ matrix.arch }}
          path: dist/bob-pet-darwin-${{ matrix.arch }}.vsix

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every build's package, flattened into dist/ the way a local build leaves them.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check every target is here
        shell: bash
        run: |
          ls -l dist
          for target in bob-pet-0*.vsix bob-pet-darwin-arm64.vsix bob-pet-darwin-x64.vsix; do
            ls dist/$target >/dev/null || { echo "::error title=Missing package::$target was not built"; exit 1; }
          done

      - name: Checksums
        run: npm run checksums

      # Skipped until OPEN_VSX_TOKEN is added to the repository's secrets. ovsx reads
      # OVSX_PAT from the environment; passing it as an argument would put the token on the
      # command line, where anything on the runner can read it.
      - name: Publish every target to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        if: ${{ env.OVSX_PAT != '' }}
        shell: bash
        run: |
          set -e
          for vsix in dist/*.vsix; do
            echo "Publishing $vsix"
            npx --yes ovsx publish "$vsix"
          done

      - name: Keep the builds with the tag
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.vsix
            dist/SHA256SUMS.txt
