# Builds the macOS packages on Apple hardware, which is the only place a .app can be
# produced correctly. Nothing is published: the packages are attached to the run so they
# can be installed by hand and tested before any release.
name: macOS build

on:
  push:
    branches: [platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A run's logs and summary both need a sign-in to read, but annotations do not, so
      # a failure is republished as one. Newlines become ~ to keep it to a single line.
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ "$code" -ne 0 ]; then
            detail=$(tail -30 test-output.txt | sed 's/%/%25/g' | tr '\n' '~')
            echo "::error title=macOS tests failed::${detail}"
          fi
          exit $code

      - name: Build the pet for macOS
        shell: bash
        run: |
          set +e
          npm run build --workspace=@bob-pet/companion
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never --project apps/companion > build-output.txt 2>&1
          code=$?
          cat build-output.txt
          if [ "$code" -ne 0 ]; then
            detail=$(tail -30 build-output.txt | sed 's/%/%25/g' | tr '\n' '~')
            echo "::error title=macOS pet build failed::${detail}"
          fi
          exit $code

      # electron-builder rewrites the binary, which invalidates the signature Electron
      # ships with. Apple Silicon kills an unsigned Mach-O outright, so it is re-signed
      # ad-hoc here; that is enough to run, and needs no Apple account.
      - name: Sign the bundle
        shell: bash
        run: |
          app=$(ls -d dist/mac*/Bob\ Pet.app | head -1)
          codesign --force --deep --sign - "$app"
          codesign -dv "$app" 2>&1 | head -3

      - name: Put the pet inside the extension
        run: node scripts/bundle-companion.mjs darwin-${{ matrix.arch }}

      - name: Package the extension for darwin-${{ matrix.arch }}
        shell: bash
        working-directory: packages/extension
        run: |
          set +e
          npx vsce package --target darwin-${{ matrix.arch }} --out ../../dist/bob-pet-darwin-${{ matrix.arch }}.vsix > package-output.txt 2>&1
          code=$?
          cat package-output.txt
          if [ "$code" -ne 0 ]; then
            detail=$(tail -30 package-output.txt | sed 's/%/%25/g' | tr '\n' '~')
            echo "::error title=packaging failed::${detail}"
          fi
          exit $code

      # Starts the packaged pet and delivers a hook event to it, the way Bob would.
      - name: Smoke test the packaged extension
        shell: bash
        run: node scripts/smoke-mac.mjs dist/bob-pet-darwin-${{ matrix.arch }}.vsix ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: bob-pet-darwin-${{ matrix.arch }}
          path: dist/bob-pet-darwin-${{ matrix.arch }}.vsix
