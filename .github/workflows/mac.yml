# Builds the macOS packages on Apple hardware, which is the only place a .app can be
# produced correctly. Nothing is published: the packages are attached to the run so they
# can be installed by hand and tested before any release.
name: macOS build

on:
  push:
    branches: [platforms]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A run's logs and summary both need a sign-in to read, but annotations do not, so
      # a failure is republished as one and can be read from the run page or the API.
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            detail=$(grep -vE '^\s*$' test-output.txt | tail -25 | sed 's/%/%25/g; s// /g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=macOS tests failed::$detail"
          fi
          exit $code

      - name: Build the pet for macOS
        run: npm run build --workspace=@bob-pet/companion && npx electron-builder --mac dir --${{ matrix.arch }} --publish never --project apps/companion

      - name: Put the pet inside the extension
        run: node scripts/bundle-companion.mjs darwin-${{ matrix.arch }}

      - name: Package the extension for darwin-${{ matrix.arch }}
        run: npx vsce package --target darwin-${{ matrix.arch }} --out dist/bob-pet-darwin-${{ matrix.arch }}.vsix
        working-directory: packages/extension

      - uses: actions/upload-artifact@v4
        with:
          name: bob-pet-darwin-${{ matrix.arch }}
          path: dist/bob-pet-darwin-${{ matrix.arch }}.vsix
